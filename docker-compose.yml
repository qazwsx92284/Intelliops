services:
  postgres:
    image: postgres:16-alpine
    container_name: intelliops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:intelliops}
      POSTGRES_USER: ${DB_USERNAME:intelliops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:intelliops}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:intelliops} -d ${DB_NAME:intelliops}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

