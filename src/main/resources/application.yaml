spring:
  application:
    name: IntelliOps
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/intelliops}
    username: ${DB_USERNAME:intelliops}
    password: ${DB_PASSWORD:intelliops}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  ai:
    openai:
      api-key: ${INTELLIOPS_AI_API_KEY:${OPENAI_API_KEY:}}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        enabled: ${INTELLIOPS_AI_ENABLED:${OPENAI_ENABLED:false}}
      image:
        enabled: ${OPENAI_IMAGE_ENABLED:false}
      embedding:
        enabled: false
      chat.options:
        model: ${OPENAI_MODEL:gpt-4o-mini}
        temperature: ${OPENAI_TEMPERATURE:0.2}
        maxTokens: ${OPENAI_MAX_TOKENS:800}

server:
  port: ${SERVER_PORT:8080}

intelliops:
  ai:
    api-key: ${INTELLIOPS_AI_API_KEY:${OPENAI_API_KEY:}}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    max-tokens: ${OPENAI_MAX_TOKENS:800}
    temperature: ${OPENAI_TEMPERATURE:0.2}