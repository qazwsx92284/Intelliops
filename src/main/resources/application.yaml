spring:
  application:
    name: IntelliOps
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  ai:
    openai:
      api-key: ${INTELLIOPS_AI_API_KEY:${OPENAI_API_KEY:${OPENAI_SECRET_KEY:}}}
      base-url: ${INTELLIOPS_AI_BASE_URL:${OPENAI_BASE_URL:https://api.openai.com}}
      chat:
        enabled: ${INTELLIOPS_AI_ENABLED:${OPENAI_ENABLED:false}}
      image:
        enabled: ${OPENAI_IMAGE_ENABLED:false}
      embedding:
        enabled: false
      audio:
        transcription:
          enabled: false
        speech:
          enabled: false
      chat.options:
        model: ${INTELLIOPS_AI_MODEL:${OPENAI_MODEL:gpt-4o-mini}}
        temperature: ${INTELLIOPS_AI_TEMPERATURE:${OPENAI_TEMPERATURE:0.2}}
        maxTokens: ${INTELLIOPS_AI_MAX_TOKENS:${OPENAI_MAX_TOKENS:800}}

server:
  port: ${SERVER_PORT:8080}

intelliops:
  ai:
    api-key: ${INTELLIOPS_AI_API_KEY:${OPENAI_API_KEY:${OPENAI_SECRET_KEY:}}}
    base-url: ${INTELLIOPS_AI_BASE_URL:${OPENAI_BASE_URL:https://api.openai.com}}
    model: ${INTELLIOPS_AI_MODEL:${OPENAI_MODEL:gpt-4o-mini}}
    max-tokens: ${INTELLIOPS_AI_MAX_TOKENS:${OPENAI_MAX_TOKENS:800}}
    temperature: ${INTELLIOPS_AI_TEMPERATURE:${OPENAI_TEMPERATURE:0.2}}
