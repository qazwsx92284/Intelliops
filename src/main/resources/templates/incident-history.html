<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Incident History</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        :root {
            --bg: #071a2f;
            --panel: rgba(12, 22, 36, 0.78);
            --line: rgba(148, 163, 184, 0.18);
            --text: #edf4ff;
            --muted: #a8bbd7;
            --primary: #69a7ff;
        }
        * { font-family: 'Inter', 'Segoe UI', sans-serif; }
        body {
            background: radial-gradient(circle at top left, rgba(105, 167, 255, 0.12), transparent 35%),
                        linear-gradient(180deg, #040d1a 0%, #0b1730 100%);
            color: var(--text);
            min-height: 100vh;
        }
        .navbar {
            background: rgba(10, 16, 29, 0.9);
            border-bottom: 1px solid var(--line);
        }
        .navbar-brand { font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text) !important; }
        .nav-link { color: #dfe9ff !important; font-weight: 600; }
        .nav-link:hover { color: var(--primary) !important; }
        .container { max-width: 1240px; }
        .card {
            background: linear-gradient(180deg, rgba(14, 27, 42, 0.96), rgba(11, 19, 31, 0.96));
            border: 1px solid var(--line);
            border-radius: 1.2rem;
            box-shadow: 0 18px 50px rgba(2, 8, 23, 0.35);
        }
        .severity-badge { min-width: 94px; text-align: center; border-radius: 999px; padding: 0.5rem 0.8rem; font-size: 0.75rem; letter-spacing: 0.06em; font-weight: 700; text-transform: uppercase; }
        .btn-outline-primary {
            border-color: rgba(105, 167, 255, 0.6);
            color: var(--primary);
            font-weight: 600;
        }
        .btn-outline-primary:hover {
            background: rgba(105, 167, 255, 0.1);
            color: var(--text);
        }
        .table {
            --bs-table-color: var(--text);
            --bs-table-border-color: rgba(148, 163, 184, 0.12);
        }
        .table th {
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 0.72rem;
        }
        .alert { border-radius: 1rem; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/dashboard">IntelliOps</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
            <a class="nav-link active" th:href="@{/incidents/history}">Incident History</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div th:if="${errorMessage != null}" class="alert alert-danger" role="alert">
        <span th:text="${errorMessage}">Unable to load history.</span>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div>
            <p class="text-uppercase text-primary mb-1 small fw-semibold" style="letter-spacing:0.12em;">Audit trail</p>
            <h1 class="mb-0">Incident History</h1>
        </div>
        <a class="btn btn-outline-primary" th:href="@{/dashboard}">Back to dashboard</a>
    </div>

    <div class="card p-4">
        <div th:if="${#lists.isEmpty(incidents)}" class="alert alert-secondary mb-0">
            No incidents have been recorded yet.
        </div>

        <div th:unless="${#lists.isEmpty(incidents)}" class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr>
                    <th>Title</th>
                    <th>Severity</th>
                    <th>Status</th>
                    <th>First seen</th>
                    <th>Created</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="incident : ${incidents}">
                    <td>
                        <div class="fw-semibold" th:text="${incident.title()}">Incident</div>
                    </td>
                    <td>
                        <span class="badge rounded-pill severity-badge"
                              th:classappend="${incident.severity().name() == 'CRITICAL' ? ' bg-danger' : (incident.severity().name() == 'HIGH' ? ' bg-warning text-dark' : (incident.severity().name() == 'MEDIUM' ? ' bg-info text-dark' : ' bg-success'))}"
                              th:text="${incident.severity()}">MEDIUM</span>
                    </td>
                    <td><span class="badge bg-secondary" th:text="${incident.status()}">OPEN</span></td>
                    <td th:text="${#temporals.format(incident.firstSeenAt(), 'MMM d, yyyy HH:mm')}">--</td>
                    <td th:text="${#temporals.format(incident.createdAt(), 'MMM d, yyyy HH:mm')}">--</td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/incidents/{id}(id=${incident.id()})}">Open</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
